name: Delivery governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: delivery-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate TBD conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate branch name
        run: node scripts/validate-delivery.mjs branch "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
      - name: Validate pull request title
        run: node scripts/validate-delivery.mjs pr-title "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - name: Validate every commit
        run: node scripts/validate-delivery.mjs range "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Run test suite
        run: npm test
